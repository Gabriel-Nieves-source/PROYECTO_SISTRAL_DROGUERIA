<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SITRAL — Control de lotes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-badge">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2L4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-4z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 12l1.8 1.8L15 10" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="login-title">SITRAL</div>
          <div class="login-sub">Trazabilidad y control de lotes</div>
        </div>
      </div>

      <form id="login-form" class="login-form" autocomplete="off">
        <div class="field">
          <label for="f-usuario">Usuario</label>
          <input id="f-usuario" name="usuario" type="text" required autocomplete="username">
        </div>
        <div class="field">
          <label for="f-clave">Contraseña</label>
          <input id="f-clave" name="clave" type="password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="form-error" hidden></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Ingresar</button>
      </form>

      <details class="login-config">
        <summary>Dirección del servidor</summary>
        <div class="field">
          <label for="f-apibase">URL de la API</label>
          <input id="f-apibase" type="text" placeholder="http://127.0.0.1:8000">
          <small>Por defecto usa http://127.0.0.1:8000. Cámbiala solo si tu API corre en otra dirección (por ejemplo la IP del computador, para entrar desde el celular en la misma red Wi-Fi).</small>
        </div>
        <button type="button" class="btn btn-ghost btn-block" id="save-apibase">Guardar dirección</button>
      </details>
    </div>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app-shell" class="app-shell" hidden>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo-badge logo-badge-sm">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2L4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-4z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 12l1.8 1.8L15 10" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span>SITRAL</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">--</div>
          <div class="user-meta">
            <div class="user-name" id="user-name">—</div>
            <div class="user-role" id="user-role">—</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-block" id="logout-btn">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn" id="menu-toggle" aria-label="Abrir menú">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-status">
          <span class="dot" id="conn-dot"></span>
          <span id="conn-text">Conectando…</span>
        </div>
      </header>

      <main class="content" id="view-root">
        <!-- la vista activa se inyecta aquí -->
      </main>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal-box"></div>
  </div>

  <!-- Lector de códigos QR y de barras (usa la cámara del dispositivo). -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
