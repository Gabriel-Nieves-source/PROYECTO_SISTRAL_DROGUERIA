name: CI SITRAL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pruebas unitarias + cobertura
        run: pytest --cov --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: Análisis SonarCloud (Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: .
          args: >
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mutation-testing:
    needs: test-and-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write # solo para publicar el JSON del badge en la rama "badges"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Mutation Testing (mutmut)
        run: |
          mutmut run || true
          mutmut export-cicd-stats
          mutmut results || true

      - name: Umbral de calidad (falla si Score < 50%)
        run: python scripts/mutation_gate.py --min 50 --badge badges/mutation.json

      - name: Publicar badge de Mutation Score
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp backend/badges/mutation.json /tmp/mutation.json
          git fetch origin badges || true
          git checkout badges 2>/dev/null || git checkout --orphan badges
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/mutation.json mutation.json
          git add mutation.json
          git commit -m "chore: actualizar badge de mutation score" || exit 0
          git push origin badges

      - name: Guardar reporte de mutantes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: backend/mutants/mutmut-cicd-stats.json
