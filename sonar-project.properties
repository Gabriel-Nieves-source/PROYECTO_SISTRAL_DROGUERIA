# Reemplace con los valores de SonarCloud (Information > Organization key / Project key)
sonar.organization=gabriel-nieves-source
sonar.projectKey=Gabriel-Nieves-source_PROYECTO_SISTRAL_DROGUERIA
sonar.projectName=SITRAL

sonar.sources=backend/app,frontend
sonar.tests=backend/tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/test-results.xml
sonar.exclusions=**/__init__.py

# La cobertura se mide sobre el backend (pytest). El frontend (HTML/JS) y los
# scripts de utilidad de línea de comandos no tienen pruebas automatizadas.
sonar.coverage.exclusions=frontend/**,backend/scripts/**,backend/actualizar_passwords.py,backend/generar_hash.py,backend/verificar_password.py
